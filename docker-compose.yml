services:
  mysql:
    image: mysql:8.4
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skill_swap}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-skill_swap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-skill_swap}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-skill_swap}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-skill_swap}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-skill_swap}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      APP_RATE_LIMIT_AUTH_PER_MINUTE: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:-20}
      APP_RATE_LIMIT_PAYMENT_PER_MINUTE: ${APP_RATE_LIMIT_PAYMENT_PER_MINUTE:-30}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    depends_on:
      - backend
    ports:
      - "5174:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # Mount SSL certificates (optional — only needed for HTTPS)
      - ${SSL_CERT_DIR:-./certs}:/etc/nginx/ssl:ro
      # Mount certbot challenge directory for initial certificate issuance
      - certbot_www:/var/www/certbot
    restart: unless-stopped

  # ── Certbot (Let's Encrypt) — for automatic SSL certificate management ──
  # Usage:
  #   docker compose --profile ssl run certbot certonly --webroot \
  #     -w /var/www/certbot -d yourdomain.com
  # Renewal (set up as daily cron):
  #   docker compose --profile ssl run certbot renew && \
  #     docker compose exec frontend nginx -s reload
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ${SSL_CERT_DIR:-./certs}:/certs
    profiles:
      - ssl  # Only run explicitly, not on `docker compose up`
    command: --help

volumes:
  mysql_data:
  certbot_conf:
  certbot_www:
  certs: