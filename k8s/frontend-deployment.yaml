apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswap-frontend
  namespace: skillswap
  labels:
    app: skillswap
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: skillswap
      tier: frontend
  template:
    metadata:
      labels:
        app: skillswap
        tier: frontend
    spec:
      containers:
        - name: frontend
          # 🔧 CHANGE_ME: Replace with your container registry (e.g. ghcr.io/your-username/skillswap-frontend:latest)
          image: CHANGE_ME/skillswap-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "128m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: skillswap-frontend
  namespace: skillswap
  labels:
    app: skillswap
    tier: frontend
spec:
  selector:
    app: skillswap
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  type: ClusterIP
