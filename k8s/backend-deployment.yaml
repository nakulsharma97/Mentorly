apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswap-backend
  namespace: skillswap
  labels:
    app: skillswap
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: skillswap
      tier: backend
  template:
    metadata:
      labels:
        app: skillswap
        tier: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/skillswap-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skillswap-config
            - secretRef:
                name: skillswap-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: skillswap-backend
  namespace: skillswap
  labels:
    app: skillswap
    tier: backend
spec:
  selector:
    app: skillswap
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
