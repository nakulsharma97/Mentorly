apiVersion: v1
kind: ConfigMap
metadata:
  name: skillswap-config
  namespace: skillswap
  labels:
    app: skillswap
data:
  # Non-sensitive configuration values
  SPRING_DATASOURCE_URL: "jdbc:mysql://skillswap-mysql:3306/skill_swap?useSSL=true&requireSSL=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "skill_swap"
  CORS_ALLOWED_ORIGINS: "https://app.yourdomain.com"
  OAUTH2_REDIRECT_URL: "https://app.yourdomain.com/oauth/callback"
  APP_RATE_LIMIT_AUTH_PER_MINUTE: "12"
  APP_RATE_LIMIT_PAYMENT_PER_MINUTE: "20"
  SPRING_PROFILES_ACTIVE: "prod"
  APP_EMAIL_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: skillswap-secrets
  namespace: skillswap
  labels:
    app: skillswap
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual secrets
  JWT_SECRET: "replace-with-your-jwt-secret"
  SPRING_DATASOURCE_PASSWORD: "replace-with-db-password"
  GOOGLE_CLIENT_ID: "replace-me"
  GOOGLE_CLIENT_SECRET: "replace-me"
  GITHUB_CLIENT_ID: "replace-me"
  GITHUB_CLIENT_SECRET: "replace-me"
  STRIPE_SECRET_KEY: "replace-me"
  SENTRY_DSN: ""
