apiVersion: v1
kind: ConfigMap
metadata:
  name: skillswap-config
  namespace: skillswap
  labels:
    app: skillswap
data:
  # Non-sensitive configuration values
  SPRING_DATASOURCE_URL: "jdbc:mysql://skillswap-mysql:3306/skill_swap?useSSL=true&requireSSL=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "skill_swap"
  # 🔧 CHANGE_ME: Replace with your actual domain (e.g. https://skillswap.example.com)
  CORS_ALLOWED_ORIGINS: "https://CHANGE_ME.example.com"
  # 🔧 CHANGE_ME: Replace with your actual domain
  OAUTH2_REDIRECT_URL: "https://CHANGE_ME.example.com/oauth/callback"
  APP_RATE_LIMIT_AUTH_PER_MINUTE: "12"
  APP_RATE_LIMIT_PAYMENT_PER_MINUTE: "20"
  SPRING_PROFILES_ACTIVE: "prod"
  APP_EMAIL_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: skillswap-secrets
  namespace: skillswap
  labels:
    app: skillswap
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual secrets
  JWT_SECRET: "CHANGE_ME-to-a-base64-encoded-32-byte-secret"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME-to-your-database-password"
  GOOGLE_CLIENT_ID: "CHANGE_ME-google-client-id"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME-google-client-secret"
  GITHUB_CLIENT_ID: "CHANGE_ME-github-client-id"
  GITHUB_CLIENT_SECRET: "CHANGE_ME-github-client-secret"
  STRIPE_SECRET_KEY: "CHANGE_ME-stripe-secret-key"
  SENTRY_DSN: ""
