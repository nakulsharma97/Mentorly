server {
  listen 80 default_server;
  server_name _;

  # Redirect all HTTP traffic to HTTPS (unless SSL certs not yet provisioned)
  # During initial Let's Encrypt certificate issuance, /.well-known/ must be
  # served over HTTP. Remove the 'return 301' block below temporarily if
  # running certbot in standalone mode instead.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;

  # ── SSL Certificates ─────────────────────────────────────
  # Mount your certificate files into /etc/nginx/ssl/ via Docker volumes.
  # For Let's Encrypt, these are typically:
  #   /etc/letsencrypt/live/yourdomain.com/fullchain.pem
  #   /etc/letsencrypt/live/yourdomain.com/privkey.pem
  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;

  # ── Modern TLS Configuration ─────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # OCSP Stapling
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;

  # ── Security Headers ─────────────────────────────────────
  # The CSP is defined once as a variable and reused everywhere, because nginx
  # does NOT inherit server-level add_header directives into locations that
  # declare their own add_header (e.g. /assets/, /index.html, /service-worker.js).
  # Those locations re-emit every security header below.
  #
  # CSP notes:
  #  - 'unsafe-inline'/'unsafe-eval' for scripts: index.html ships the
  #    Tailwind Play CDN (cdn.tailwindcss.com) with an inline tailwind.config
  #    script. Removing these would break the UI until Tailwind is built
  #    locally instead of loaded from the CDN.
  #  - Razorpay checkout is injected dynamically (script + iframe).
  #  - Sentry is bundled via npm; only the ingest endpoint is contacted.
  #  - connect-src allows the API origins used by docker-compose (backend:8080)
  #    and local dev (localhost:8080); same-origin /api and wss are covered by
  #    'self'.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.ingest.sentry.io https://api.razorpay.com http://localhost:8080 http://127.0.0.1:8080 http://backend:8080 ws://localhost:* ws://127.0.0.1:*; frame-src https://checkout.razorpay.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ── Static Files ──────────────────────────────────────────
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Re-declared because this location defines its own add_header (see note above).
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    # Re-declared because this location defines its own add_header (see note above).
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    # Re-declared because this location defines its own add_header (see note above).
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # ── API / WebSocket Proxy ────────────────────────────────
  # The SPA is built same-origin (VITE_API_BASE_URL empty in production) and
  # these routes are proxied to the backend service inside the Docker network.
  # This keeps browsers talking to the frontend host only (no internal
  # hostnames like backend:8080 leaked to clients).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  location /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  location /login/oauth2/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  location /ws/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
