name: deploy

on:
  # ── Triggered after a successful Docker image push ─────
  workflow_run:
    workflows: ["backend-ci"]
    types:
      - completed
    branches:
      - main

  # ── Manual trigger for quick redeploys / rollbacks ────
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - staging
          - production
        default: production
      image_tag:
        description: "Docker image tag to deploy (defaults to 'latest' for main, commit SHA for rollback)"
        required: false
        default: ""
      skip_health_check:
        description: "Skip health check verification"
        type: boolean
        default: false

env:
  # Image registry — must match backend-ci.yml
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  # ── Notification colors ────────────────────────────────
  SLACK_COLOR_SUCCESS: "good"
  SLACK_COLOR_FAILURE: "danger"
  SLACK_COLOR_WARNING: "warning"

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    # Only deploy if the triggering CI workflow succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # CRITICAL: this is what makes the environment secrets available to the
    # job. The name must EXACTLY match the GitHub Environment the secrets are
    # stored in (case-sensitive). workflow_dispatch inputs are not populated on
    # workflow_run events, so that path falls back to 'production'.
    environment: ${{ inputs.environment || 'production' }}
    concurrency: deploy-${{ inputs.environment || 'production' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      env_name: ${{ steps.target.outputs.env_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Determine image tag ──────────────────────────────
      - name: Determine image tag
        id: tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            TAG="$IMAGE_TAG_INPUT"
            echo "source=manual input"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Get SHA from the triggering workflow's commit
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="${SHA:0:7}"
            echo "source=commit SHA (${TAG})"
          else
            TAG="latest"
            echo "source=default (latest)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: ${TAG}"

      # ── Determine target from environment ────────────────
      # Secrets are read through environment variables (never echoed into the
      # script) and only written to step outputs once the environment resolves.
      # Only presence is reported in the log — never values. The SSH key is
      # written via the multiline $GITHUB_OUTPUT delimiter syntax so it survives
      # intact and is selected per environment (no silent cross-env fallback).
      - name: Set deployment target
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_PROTOCOL: ${{ secrets.STAGING_PROTOCOL }}
        run: |
          # workflow_dispatch inputs are not populated on workflow_run events,
          # so fall back to production unless an environment was explicitly given.
          ENV_NAME="${{ inputs.environment }}"
          if [ -z "$ENV_NAME" ]; then
            ENV_NAME="production"
          fi
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: ${ENV_NAME} (event: ${{ github.event_name }})"

          case "$ENV_NAME" in
            staging)
              HOST="$STAGING_HOST"; USER="$STAGING_USER"; PATH_DIR="$STAGING_PATH"
              SSH_KEY="$STAGING_SSH_KEY"
              PORT="${STAGING_SSH_PORT:-22}"; PROTOCOL="${STAGING_PROTOCOL:-https}"
              ;;
            production)
              HOST="$DEPLOY_HOST"; USER="$DEPLOY_USER"; PATH_DIR="$DEPLOY_PATH"
              SSH_KEY="$DEPLOY_SSH_KEY"
              PORT="${DEPLOY_SSH_PORT:-22}"; PROTOCOL="${DEPLOY_PROTOCOL:-https}"
              ;;
            *)
              echo "❌ Unknown deployment environment '${ENV_NAME}'. Supported: staging, production." >&2
              exit 1
              ;;
          esac

          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          echo "path=${PATH_DIR}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "protocol=${PROTOCOL}" >> "$GITHUB_OUTPUT"

          # Multiline-safe key output (SSH private keys contain newlines).
          if [ -n "$SSH_KEY" ]; then
            {
              echo "key<<SSH_KEY_EOF"
              echo "$SSH_KEY"
              echo "SSH_KEY_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

          # Safe presence diagnostics — booleans only, never values.
          echo "Deployment target configured for: ${ENV_NAME}"
          echo "  Host configured:     $([ -n "$HOST" ] && echo true || echo false)"
          echo "  User configured:     $([ -n "$USER" ] && echo true || echo false)"
          echo "  Path configured:     $([ -n "$PATH_DIR" ] && echo true || echo false)"
          echo "  SSH key configured:  $([ -n "$SSH_KEY" ] && echo true || echo false)"
          echo "  SSH port:            ${PORT}"
          echo "  Protocol:            ${PROTOCOL}"

      # ── Validate deployment configuration before SSH ─────
      # Fail early with a clear, secret-free message instead of letting the SSH
      # action fail with "missing server host". Only presence is checked.
      - name: Validate deployment configuration
        run: |
          ENV_NAME="${{ steps.target.outputs.env_name }}"
          TARGET_HOST="${{ steps.target.outputs.host }}"
          TARGET_USER="${{ steps.target.outputs.user }}"
          TARGET_PATH="${{ steps.target.outputs.path }}"
          TARGET_KEY="${{ steps.target.outputs.key }}"
          TARGET_PORT="${{ steps.target.outputs.port }}"

          case "$ENV_NAME" in
            staging)    HOST_SECRET="STAGING_HOST";  USER_SECRET="STAGING_USER";  PATH_SECRET="STAGING_PATH";  KEY_SECRET="STAGING_SSH_KEY";;
            production) HOST_SECRET="DEPLOY_HOST";   USER_SECRET="DEPLOY_USER";   PATH_SECRET="DEPLOY_PATH";   KEY_SECRET="DEPLOY_SSH_KEY";;
            *)          echo "❌ Unknown deployment environment '${ENV_NAME}'." >&2; exit 1;;
          esac

          WHERE="the '${ENV_NAME}' GitHub Environment (Settings → Environments → ${ENV_NAME} → Environment secrets) or at the repository level"

          FAILED=0
          [ -n "$TARGET_HOST" ] || { echo "❌ Deployment host is missing. Configure ${HOST_SECRET} in ${WHERE}."; FAILED=1; }
          [ -n "$TARGET_USER" ] || { echo "❌ Deployment username is missing. Configure ${USER_SECRET} in ${WHERE}."; FAILED=1; }
          [ -n "$TARGET_PATH" ] || { echo "❌ Deployment path (COMPOSE_DIR) is missing. Configure ${PATH_SECRET} in ${WHERE}."; FAILED=1; }
          [ -n "$TARGET_KEY" ]  || { echo "❌ Deployment SSH key is missing. Configure ${KEY_SECRET} in ${WHERE}."; FAILED=1; }
          case "$TARGET_PORT" in
            ''|*[!0-9]*) echo "❌ Deployment SSH port is invalid: '${TARGET_PORT}'. Configure DEPLOY_SSH_PORT/STAGING_SSH_PORT as a number (e.g. 22)."; FAILED=1;;
          esac

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Deployment configuration is incomplete — add the missing secrets, then re-run the workflow."
            exit 1
          fi

          echo "✅ Deployment target configured: yes (${ENV_NAME})"
          echo "   Host: set | User: set | Path: set | SSH key: set | Port: ${TARGET_PORT}"

      # ── Deploy via SSH ───────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          COMPOSE_DIR: ${{ steps.target.outputs.path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ steps.target.outputs.key }}
          port: ${{ steps.target.outputs.port }}
          script: |
            set -e
            echo "=== Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ==="
            echo ""

            # Run the deploy script from the project directory
            cd "$COMPOSE_DIR"

            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh --tag "$IMAGE_TAG"

      # ── Post-deployment smoke tests ──────────────────────
      - name: Smoke test — Health endpoint
        if: ${{ !inputs.skip_health_check }}
        env:
          PROTOCOL: ${{ steps.target.outputs.protocol }}
        run: |
          echo "Waiting for backend to be reachable..."
          sleep 10
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "$PROTOCOL://${{ steps.target.outputs.host }}/actuator/health" \
              2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  Attempt $i/12: HTTP $HTTP_CODE — retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed from GitHub runner"
          exit 1

      - name: Smoke test — Signup page loads
        env:
          PROTOCOL: ${{ steps.target.outputs.protocol }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$PROTOCOL://${{ steps.target.outputs.host }}/api/v1/auth/signup" \
            2>/dev/null || echo "000")
          echo "Signup endpoint: HTTP $HTTP_CODE"
          # 401 or 400 means the server is responding (authentication challenge)
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Server is responding"
          else
            echo "⚠️ Unexpected status: $HTTP_CODE"
          fi

      # ── Log deployment summary ───────────────────────────
      - name: Log deployment summary
        id: summary
        run: |
          ENV_NAME="${{ steps.target.outputs.env_name }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          HOST="${{ steps.target.outputs.host }}"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "=========================================="
          echo "  Deployment complete"
          echo "=========================================="
          echo "  Environment:  ${ENV_NAME}"
          echo "  Image:        ${IMG}"
          echo "  Host:         ${HOST}"
          echo "  Triggered by: ${{ github.event_name }}"
          echo "  Status:       ${{ job.status }}"
          echo ""

  # ─────────────── Notifications ─────────────────
  notify:
    name: Send notifications
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The secrets context is not allowed in `if:` expressions, so resolve the
      # optional notification secrets through a probe step and gate the Slack
      # and email steps on its outputs instead. Missing secrets only skip the
      # optional notification — the deployment outcome is unaffected.
      - name: Check notification configuration
        id: notify-config
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "slack=true" >> "$GITHUB_OUTPUT"
          else
            echo "slack=false" >> "$GITHUB_OUTPUT"
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
          fi
          if [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_TO" ]; then
            echo "mail=true" >> "$GITHUB_OUTPUT"
          else
            echo "mail=false" >> "$GITHUB_OUTPUT"
            echo "MAIL_SERVER/MAIL_TO are not configured; skipping email notification."
          fi

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "title=Deploy successful" >> "$GITHUB_OUTPUT"
            echo "color=${{ env.SLACK_COLOR_SUCCESS }}" >> "$GITHUB_OUTPUT"
            echo "detail=Deploy completed successfully" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "emoji=⏭️" >> "$GITHUB_OUTPUT"
            echo "title=Deploy skipped" >> "$GITHUB_OUTPUT"
            echo "color=${{ env.SLACK_COLOR_WARNING }}" >> "$GITHUB_OUTPUT"
            echo "detail=Deploy was skipped — check CI status" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "title=Deploy failed" >> "$GITHUB_OUTPUT"
            echo "color=${{ env.SLACK_COLOR_FAILURE }}" >> "$GITHUB_OUTPUT"
            echo "detail=Deploy to ${{ needs.deploy.outputs.env_name || '?' }} failed — check the workflow for details" >> "$GITHUB_OUTPUT"
          fi

      # ── Slack notification ───────────────────────────────
      - name: Send Slack notification
        if: steps.notify-config.outputs.slack == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "title": "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.title }}",
                "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "fields": [
                  {"title": "Environment", "value": "${{ needs.deploy.outputs.env_name || 'production' }}", "short": true},
                  {"title": "Image", "value": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.deploy.outputs.tag || 'latest' }}", "short": true},
                  {"title": "Host", "value": "${{ secrets.DEPLOY_HOST || 'N/A' }}", "short": true},
                  {"title": "Trigger", "value": "${{ github.event_name }}", "short": true}
                ],
                "footer": "SkillSwap Deploy",
                "ts": $(date +%s)
              }]
            }

      # ── Email notification ───────────────────────────────
      - name: Send email notification
        if: steps.notify-config.outputs.mail == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 587 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} SkillSwap Deploy: ${{ steps.status.outputs.title }} to ${{ needs.deploy.outputs.env_name || 'production' }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || 'SkillSwap Deploy <deploy@skillswap.app>' }}
          body: |
            Environment:  ${{ needs.deploy.outputs.env_name || 'production' }}
            Image:        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.deploy.outputs.tag || 'latest' }}
            Status:       ${{ steps.status.outputs.title }}
            Details:      ${{ steps.status.outputs.detail }}
            Host:         ${{ secrets.DEPLOY_HOST || 'N/A' }}
            Trigger:      ${{ github.event_name }}
            Workflow:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            --
            SkillSwap Deployment Bot
