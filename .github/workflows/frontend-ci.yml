name: frontend-ci

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

      # ── Playwright E2E tests (conditional: need a running backend) ──
      # The secrets context is not allowed in `if:` expressions, so resolve the
      # optional PLAYWRIGHT_BACKEND_URL secret through a probe step and gate the
      # E2E steps on its output instead.
      - name: Check Playwright backend URL configuration
        id: playwright
        env:
          PLAYWRIGHT_BACKEND_URL: ${{ secrets.PLAYWRIGHT_BACKEND_URL }}
        run: |
          if [ -n "$PLAYWRIGHT_BACKEND_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PLAYWRIGHT_BACKEND_URL is not configured; skipping backend-dependent Playwright tests."
          fi

      - name: Install Playwright browsers
        if: steps.playwright.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.playwright.outputs.configured == 'true'
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BACKEND_URL: ${{ secrets.PLAYWRIGHT_BACKEND_URL }}

      - name: Upload Playwright report
        if: always() && steps.playwright.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
