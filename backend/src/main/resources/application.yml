server:
  port: 8080

spring:
  config:
    # Load backend/.env (or the project-root .env) automatically so the app
    # works with plain `mvn spring-boot:run`, IDE launches, and `java -jar`
    # without manually exporting environment variables first. `optional:`
    # means a missing .env is fine (e.g. containers, where secrets come from
    # the real environment / orchestrator). OS environment variables always
    # take precedence over .env values, matching start-backend.ps1 semantics.
    #
    # Relative file: imports are resolved against the working directory, so
    # this covers running from backend/ (./.env) and from the repo root
    # (../.env), matching the two locations start-backend.ps1 probes.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # No default secret: the dev profile supplies a local default
    # (application-dev.yml / application-local.yml) and staging/prod override
    # this with ${SPRING_DATASOURCE_PASSWORD} (no default) so a missing key
    # fails fast. The `:` here avoids a subtle trap: these properties are bound
    # via @ConfigurationProperties, so an unresolved placeholder would NOT fail
    # startup — Hikari would send the raw "${SPRING_DATASOURCE_PASSWORD}"
    # string as the password and fail with a confusing "Access denied (using
    # password: YES)". With the empty default, a misconfigured launch fails
    # with a clean MySQL auth error instead.
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:disabled-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:disabled-github-client-secret}
            scope:
              - read:user
              - user:email
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

# ── API documentation (Swagger/OpenAPI) ────────────────────
# Disabled by default in every profile. Only the dev and local profiles
# re-enable it (see application-dev.yml / application-local.yml) so the
# internal endpoint schemas are never exposed in prod/staging.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # JWT_SECRET is REQUIRED from the OS environment or a .env file (see
    # spring.config.import above — backend/.env is loaded automatically).
    # There is deliberately NO default fallback secret: a missing/blank value
    # resolves to "" and JwtService blocks startup with a clear, actionable
    # message instead of booting with a weak/forgeable key.
    #
    # The `:` default keeps the failure mode readable: without it a missing
    # JWT_SECRET produces the cryptic "Could not resolve placeholder" error;
    # with it, JwtService.validateSecret() and EnvironmentConfigValidator fail
    # startup with explicit guidance.
    #
    # Prod/staging override this below with ${JWT_SECRET} (no default) so a
    # missing key still fails fast at config load in real environments.
    secret: ${JWT_SECRET:}
    # Short-lived access tokens (15 min) limit the blast radius of an XSS-able
    # token stored in browser storage; the SPA silently refreshes via the
    # httpOnly refresh_token cookie when it hits a 401. Override with
    # JWT_EXPIRATION_MS if a longer lived token is required.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  rate-limit:
    auth:
      max-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    payment:
      max-per-minute: ${APP_RATE_LIMIT_PAYMENT_PER_MINUTE:30}
    api-write:
      max-per-minute: ${APP_RATE_LIMIT_API_WRITE_PER_MINUTE:120}
    search:
      max-per-minute: ${APP_RATE_LIMIT_SEARCH_PER_MINUTE:60}
  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:5174/oauth/callback}
  booking:
    completion-confirm-timeout-hours: ${BOOKING_COMPLETION_CONFIRM_TIMEOUT_HOURS:24}
    completion-check-poll-ms: ${BOOKING_COMPLETION_CHECK_POLL_MS:120000}
  payment:
    stripe:
      # REAL Stripe integration (test mode). Keys come from the Stripe dashboard
      # (toggle "Test mode" → Developers > API keys) or `stripe listen`.
      # The placeholders trigger a startup warning (validateKeys) and any real
      # API call fails with a clear Stripe error — nothing is fabricated.
      secret-key: ${STRIPE_SECRET_KEY:sk_test_xxxxxxxxxxxx}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_secret}
      connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:whsec_test_connect_secret}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    name: ${APP_ADMIN_NAME:Platform Admin}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    from: ${APP_EMAIL_FROM:no-reply@mentorly.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  websocket:
    # Origins permitted to open WebSocket connections. Must include the SPA
    # origin(s) in every environment or real-time chat/notifications break.
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080}
  security:
    # When true, the app trusts proxy-supplied client IP headers for rate
    # limiting and audit logging. MUST only be enabled when deployed behind a
    # trusted reverse proxy that overwrites/appends these headers (see
    # frontend/nginx.conf: X-Forwarded-For uses $proxy_add_x_forwarded_for and
    # X-Real-IP uses $remote_addr). When enabled, only the RIGHT-MOST
    # X-Forwarded-For entry (the one the proxy appended) is trusted. When
    # false, proxy headers are ignored entirely and request.getRemoteAddr() is
    # used, so clients can never spoof their rate-limit identity.
    trusted-proxy: ${APP_TRUSTED_PROXY:false}
  auth:
    cookies:
      secure: ${APP_AUTH_COOKIE_SECURE:false}
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 20 3 * * *}
  files:
    # Uploaded files are inaccessible after this many days and then purged.
    expiration-days: ${APP_FILES_EXPIRATION_DAYS:30}
    cleanup-cron: ${APP_FILES_CLEANUP_CRON:0 30 3 * * *}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 0.2
  send-default-pii: false
  enable-tracing: true

logging:
  level:
    com.skillswap: INFO
    org.springframework.security: DEBUG
  pattern:
    level: "%5p [traceId=%X{traceId:-na}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ── Operational endpoints ──────────────────────────────────
# Only /actuator/health is exposed by default: the Kubernetes liveness/readiness
# probes and the deploy.yml smoke check depend on it. The more sensitive endpoints
# (info, metrics, prometheus) are enabled per-profile in application-dev.yml and
# application-local.yml only, never in prod/staging.
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # The built-in MailHealthIndicator pings the SMTP server on every health
    # request. With MAIL_PASSWORD empty (the default) that probe fails and flips
    # the whole /actuator/health endpoint to DOWN/503 — which breaks the
    # deploy.yml smoke test and the deploy.sh health gate even though email is
    # an optional feature (app.email.enabled defaults to false).
    #
    # Fix: run the mail probe only when email is actually enabled. Operators who
    # set APP_EMAIL_ENABLED=true must also configure MAIL_HOST / MAIL_USERNAME /
    # MAIL_PASSWORD — and then a broken SMTP connection correctly surfaces as
    # unhealthy (fail-fast), instead of silently reddening every deployment.
    mail:
      # Follows app.email.enabled (single source of truth) — mail probe only
      # runs when the email feature is actually switched on.
      enabled: ${app.email.enabled:false}
  metrics:
    export:
      simple:
        enabled: true
  info:
    app:
      name: Skill Swapping Platform Backend
      description: Backend API for the Skill Swapping Platform
      version: 0.0.1
