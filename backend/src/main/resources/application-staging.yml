spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://staging-db:3306/skill_swap?useSSL=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  level:
    root: INFO
    com.skillswap: INFO

app:
  jwt:
    # Required — NO dev fallback. The JWT signing key must be supplied via the
    # JWT_SECRET environment variable; startup fails fast if it is missing.
    secret: ${JWT_SECRET}
  rate-limit:
    auth:
      max-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:15}
    payment:
      max-per-minute: ${APP_RATE_LIMIT_PAYMENT_PER_MINUTE:25}
  payment:
    razorpay:
      # Fail startup if placeholder/test Razorpay keys are configured. The test
      # secret is public and lets anyone forge webhook signatures.
      fail-on-placeholder: ${APP_PAYMENT_RAZORPAY_FAIL_ON_PLACEHOLDER:true}
  security:
    # The staging API is fronted by the nginx proxy (frontend/nginx.conf),
    # which appends the real client IP as the right-most X-Forwarded-For entry
    # and sets X-Real-IP — so proxy headers are trusted by default.
    trusted-proxy: ${APP_TRUSTED_PROXY:true}
