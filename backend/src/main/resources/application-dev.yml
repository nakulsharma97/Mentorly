spring:
  jpa:
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}

logging:
  level:
    root: INFO
    com.skillswap: DEBUG

app:
  rate-limit:
    auth:
      max-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    payment:
      max-per-minute: ${APP_RATE_LIMIT_PAYMENT_PER_MINUTE:30}
  auth:
    cookies:
      secure: false
